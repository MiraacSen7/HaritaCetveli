<style>
/* VOICE: kesin, sakin; saha ve sınıf için hesap cetveli — her sonuç adım adım
   IDEA: topografik pafta ve kitabe — mavi bant, macenta grid aksanı
   PICTURE: her aracın kendi küçük şekli (grid karesi, pafta bölmesi, sapma diyagramı, pusula kadranı) ve büyük sonuç
   COLOUR and TYPE: harita mavisi bant, beyaz kâğıt, macenta grid; Barlow Condensed başlık + Barlow metin
   LAYOUT: üstte arama ve sekmeler, altında araç kartları; telefonda tek sütun */
:root{color-scheme:light dark;
--bg:light-dark(#ffffff,#0e1317);--ink:light-dark(#14191e,#e8edf1);--mut:light-dark(#5b6670,#9aa7b2);
--line:light-dark(#d9dfe4,#26313a);--card:light-dark(#ffffff,#141b21);--field:light-dark(#f3f6f8,#1a232b);--soft:light-dark(#f6f8fa,#11181e);
--blue:light-dark(#0f4c8a,#123a63);--blue2:light-dark(#1565c0,#6fb1ff);--mag:light-dark(#c4166c,#ff6fb0);--err:light-dark(#b3261e,#ff8a80);--ok:light-dark(#1b6e3a,#7fd49a);--gold:light-dark(#b7791f,#f6c453)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Barlow,system-ui,sans-serif;overflow-x:clip}
h1,h2,h3,.big,.tab{font-family:"Barlow Condensed",Barlow,sans-serif}
header.top{position:relative;z-index:5;background:var(--blue);color:#fff;padding:calc(20px + env(safe-area-inset-top)) max(4vw,16px,env(safe-area-inset-right)) 0 max(4vw,16px,env(safe-area-inset-left))}
header.top svg.topo{position:absolute;inset:0;width:100%;height:100%;opacity:.22;pointer-events:none}
.hrow{position:relative;display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
h1{margin:0;font-size:clamp(32px,5vw,46px);line-height:1.05;font-weight:700}
header.top p{position:relative;margin:4px 0 12px;max-width:68ch;color:#d6e6f7}
.lang{display:flex;border:1px solid rgba(255,255,255,.5);border-radius:8px;overflow:hidden;flex:none}
.lang button{min-height:40px;min-width:46px;border:0;background:transparent;color:#fff;font:600 15px Barlow;cursor:pointer}
.lang button[aria-pressed=true]{background:#fff;color:var(--blue)}
.search{position:relative;max-width:560px;margin-bottom:14px}
.search input{width:100%;min-height:46px;border:0;border-radius:10px;padding:10px 14px 10px 40px;font:16px Barlow;background:#fff;color:#14191e}
.search svg{position:absolute;left:12px;top:13px;width:20px;height:20px;stroke:#5b6670;fill:none;stroke-width:2.2}
#qres{position:absolute;z-index:20;left:0;right:0;top:50px;margin:0;padding:6px;list-style:none;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.25);max-height:60vh;overflow:auto}
#qres button{width:100%;text-align:left;min-height:44px;border:0;background:none;color:var(--ink);font:15px Barlow;padding:6px 10px;border-radius:8px;cursor:pointer;display:flex;justify-content:space-between;gap:10px}
#qres button:hover,#qres button:focus-visible{background:var(--field)}#qres small{color:var(--mut)}
.tabs{position:relative;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tab{flex:none;min-height:46px;padding:8px 16px;border:0;border-radius:10px 10px 0 0;background:rgba(255,255,255,.12);color:#fff;font-size:18px;font-weight:600;cursor:pointer}
.tab[aria-selected=true]{background:var(--bg);color:var(--ink)}
:focus-visible{outline:3px solid var(--mag);outline-offset:2px}
main{max-width:1240px;margin:0 auto;padding:clamp(18px,3vw,36px) max(4vw,16px,env(safe-area-inset-right)) 40px max(4vw,16px,env(safe-area-inset-left))}
.intro{margin:0 0 18px;color:var(--mut);max-width:80ch}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,370px),1fr));gap:18px;align-items:start}
.tool{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px 18px;scroll-margin-top:12px}
.tool.flash{animation:fl 1.2s ease-out}@keyframes fl{0%{box-shadow:0 0 0 4px var(--mag)}100%{box-shadow:0 0 0 0 transparent}}
.tool>header{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
h3{margin:0;font-size:23px;line-height:1.1}
.star{flex:none;width:44px;height:44px;margin:-8px -10px 0 0;border:0;background:none;cursor:pointer;color:var(--mut)}
.star svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8}
.star[aria-pressed=true]{color:var(--gold)}.star[aria-pressed=true] svg{fill:currentColor}
.hint{margin:6px 0 0;color:var(--mut);font-size:15px}
.fields{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px 10px;margin-top:10px;align-items:end}
.f{grid-column:span 3}.f.w2{grid-column:span 2}.f.w6,.fh{grid-column:1/-1}
.fh{font:600 16px "Barlow Condensed";color:var(--ink);margin-top:6px;border-top:1px dashed var(--line);padding-top:8px}
label{display:block;font-size:14px;font-weight:600;color:var(--mut);margin-bottom:3px;line-height:1.25}
input,select,textarea{width:100%;min-height:44px;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--field);color:var(--ink);font:16px Barlow,sans-serif;font-variant-numeric:tabular-nums}
textarea{min-height:110px;resize:vertical}
.out{margin-top:14px;padding-top:12px;border-top:2px solid var(--ink)}
.cap{font-size:14px;color:var(--mut)}
.big{font-size:clamp(30px,4.6vw,44px);line-height:1.08;font-weight:700;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.big small{font-size:.55em;font-weight:600;color:var(--mut)}
.sub{margin:4px 0 0;font-weight:600}
.err{color:var(--err);font-weight:600;margin:0}.note{color:var(--mut);font-size:15px;margin:8px 0 0}
.good{color:var(--ok)}.bad{color:var(--err)}
dl{display:grid;grid-template-columns:minmax(0,max-content) minmax(0,1fr);gap:5px 14px;margin:10px 0 0}
dt{color:var(--mut);font-size:15px}dd{margin:0;font-weight:600;font-variant-numeric:tabular-nums;text-align:right;overflow-wrap:anywhere}
details{margin-top:12px;background:var(--soft);border-radius:8px;padding:8px 12px}
summary{cursor:pointer;font-weight:600;min-height:28px}
ol{margin:6px 0 2px;padding-left:22px;font-variant-numeric:tabular-nums}ol li{margin:3px 0}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.btn{min-height:44px;padding:8px 14px;border:1px solid var(--line);border-radius:8px;background:var(--field);color:var(--ink);font:600 15px Barlow,sans-serif;cursor:pointer}
.btn.pri{background:var(--blue2);border-color:var(--blue2);color:light-dark(#fff,#08131d)}
.btn[disabled]{opacity:.5;cursor:default}
svg.fig{display:block;width:100%;height:auto;max-height:260px;margin-top:12px}
.fig .g{stroke:var(--mag);stroke-width:.8;opacity:.5}.fig .g2{stroke:var(--mag);stroke-width:2}
.fig .k{stroke:var(--ink);fill:none;stroke-width:2}.fig .kf{fill:var(--ink)}
.fig .pt{fill:var(--blue2);stroke:var(--card);stroke-width:2.5}.fig .hl{fill:var(--blue2);fill-opacity:.16}
.fig text{font:12px Barlow;fill:var(--mut)}.fig .tx{font:600 13px Barlow;fill:var(--ink)}.fig .mg{fill:var(--mag);font-weight:600}
.fig .bl{stroke:var(--blue2);stroke-width:2.5;fill:none}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.chip{font-size:14px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--field);border:1px solid var(--line)}
.pts{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:8px}
.pts li{border:1px solid var(--line);border-radius:10px;padding:8px 10px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 8px;align-items:center}
.pts input{min-height:40px;font-weight:600}.pts .c{grid-column:1/-1;font-variant-numeric:tabular-nums;font-size:15px}.pts .m{grid-column:1/-1;color:var(--mut);font-size:13px}
.pts .a{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap}.pts .btn{min-height:40px;padding:6px 12px}
.dial{display:block;width:min(260px,70%);margin:12px auto 0}
.dial .ring{fill:var(--field);stroke:var(--line);stroke-width:2}.dial text{font:600 14px Barlow;fill:var(--ink);text-anchor:middle}.dial .n{fill:var(--mag)}
.dial .tick{stroke:var(--mut);stroke-width:1.5}.dial .needle{fill:var(--mag)}.dial .lub{stroke:var(--blue2);stroke-width:3}
.about{max-width:760px}.about h2{font-size:34px;margin:0 0 4px;line-height:1.1}.about h3{margin:22px 0 6px}
.about .sig{display:flex;gap:14px;align-items:center;margin:16px 0;padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:var(--soft)}
.about .sig img{width:56px;height:56px;border-radius:12px;flex:none}.about .sig b{font:700 22px "Barlow Condensed"}
.about ul{padding-left:20px}.about li{margin:3px 0}
.empty{color:var(--mut);font-size:15px;padding:6px 0}
/* hesap makinesi */
.calc-in{font:600 22px "Barlow Condensed",sans-serif;text-align:right}
.keys{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:10px}
.keys button{min-height:54px;border:1px solid var(--line);border-radius:10px;background:var(--field);color:var(--ink);font:600 22px "Barlow Condensed",sans-serif;cursor:pointer}
.keys .op{color:var(--blue2)}.keys .eq{background:var(--blue2);color:light-dark(#fff,#08131d);border-color:var(--blue2)}
.hist{list-style:none;margin:0;padding:0}
.hist button{width:100%;display:flex;justify-content:space-between;gap:12px;min-height:44px;padding:6px 4px;border:0;border-bottom:1px solid var(--line);background:none;color:var(--ink);font:15px Barlow;cursor:pointer;text-align:left}
.hist b{font-variant-numeric:tabular-nums;white-space:nowrap}
footer{max-width:1240px;margin:0 auto;padding:18px max(4vw,16px) calc(32px + env(safe-area-inset-bottom));color:var(--mut);font-size:13px;border-top:1px solid var(--line)}
footer .own{font-size:15px;color:var(--ink);font-weight:600;margin-bottom:4px}
@media(max-width:600px){.tab{font-size:16px;padding:8px 12px}.tool{padding:14px}.fields{gap:8px}}
@media(prefers-reduced-motion:no-preference){.panel .tool{animation:in .25s ease-out both}@keyframes in{from{opacity:0;transform:translateY(6px)}}}
@media(prefers-reduced-motion:reduce){.tool.flash{animation:none}}
</style>

<script>
{
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const store={get(k){try{return localStorage.getItem('hc2:'+k)}catch(e){return null}},set(k,v){try{localStorage.setItem('hc2:'+k,v)}catch(e){}}};
const EN=store.get('lang')==='en',L=(tr,en)=>EN?en:tr,LOC=EN?'en-US':'tr-TR',DEC=EN?'.':',';
document.documentElement.lang=EN?'en':'tr';
const OWNER='Miraç Şen',APP=L('Harita Cetveli','Map Ruler'),VER='2.1';
const num=v=>{v=String(v??'').trim().replace(/\s/g,'');if(/,/.test(v)&&!/\./.test(v))v=v.replace(',','.');else v=v.replace(/,/g,'');return v===''?NaN:Number(v)};
const fmt=(x,d=2)=>Number.isFinite(x)?x.toLocaleString(LOC,{maximumFractionDigits:d}):'—';
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rad=d=>d*Math.PI/180,deg=r=>r*180/Math.PI,p2=n=>String(n).padStart(2,'0');
const toMil=d=>d*6400/360,toDeg=m=>m*360/6400,n64=m=>((m%6400)+6400)%6400,n360=d=>((d%360)+360)%360;
const WGS={a:6378137,f:1/298.257223563},INT={a:6378388,f:1/297},K0=0.9996;
const HLA=L(['K','G'],['N','S']),HLO=L(['D','B'],['E','W']),MIL=L('milyem','mils');
const GIA=L('GİA','GA'),MIA=L('MİA','MA'),CIA=L('CİA','TA'),ISA=L('İSA','G-M'),YA=L('YA','GC'),DSA=L('DSA','DECL');
/* ---- açı ve koordinat biçimleri ---- */

/* ---- araç çalıştırma ---- */
function run(t){const el=$('#t-'+t.id),get=id=>el.querySelector(`#${t.id}-${id}`),v={s:id=>get(id)?.value??'',n:id=>num(get(id)?.value)};
 t.f.forEach(f=>{if(f.show){el.querySelector(`[data-f="${f.id}"]`).hidden=!f.show(v)}});
 let r;try{r=t.calc(v)}catch(e){r={err:L('Bu değerlerle hesaplanamadı. Girdileri kontrol et.','Could not calculate with these values. Check the inputs.')}}
 const out=el.querySelector('.out');
 if(r.err){out.innerHTML=`<p class="err">${esc(r.err)}</p>`;return}
 const plain=r.copy??String(r.big).replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim();
 const sv=r.save?`<button class="btn" type="button" data-save="${esc(JSON.stringify({z:+prof.z||null,dt:prof.dt,...r.save,src:t.title}))}">${L('Noktayı kaydet','Save point')}</button>`:'';
 const pf=r.prof?`<button class="btn" type="button" data-prof="${esc(JSON.stringify(r.prof))}">${L('Haritam’a kaydet','Save to My map')}</button>`:'';
 out.innerHTML=`<div class="cap">${r.cap}</div><div class="big">${r.big}</div>${r.sub?`<p class="sub">${r.sub}</p>`:''}${r.rows?.length?`<dl>${r.rows.map(([a,b])=>`<dt>${a}</dt><dd>${b}</dd>`).join('')}</dl>`:''}${r.fig||''}${r.steps?.length?`<details open><summary>${L('Çözüm adımları','Steps')}</summary><ol>${r.steps.map(s=>`<li>${s}</li>`).join('')}</ol></details>`:''}<div class="acts"><button class="btn" type="button" data-copy="${esc(plain)}">${L('Sonucu kopyala','Copy result')}</button>${sv}${pf}</div>`;
}
const setField=(tid,fid,val)=>{const c=$(`#${tid}-${fid}`);if(!c)return;c.value=String(val);store.set(c.id,c.value)};
T.forEach(t=>{const el=$('#t-'+t.id);t.f.forEach(f=>{if(f.h)return;const c=el.querySelector(`#${t.id}-${f.id}`),s=store.get(c.id);if(s!==null)c.value=s;const h=()=>{store.set(c.id,c.value);run(t)};c.addEventListener('input',h);c.addEventListener('change',h)});run(t)});
const TOOL={};T.forEach(t=>TOOL[t.id]=t);

/* ---- Haritam profili ---- */
function chips(){const isaD=toDeg(num(prof.isa)||0);$('#pf-chips').innerHTML=[SCALE_W(+prof.sc),`${L('Dilim','Zone')} ${esc(prof.z)}`,prof.dt==='wgs'?'WGS84':'ED50',`${ISA} ${esc(prof.isa)} ${MIL} (${fDM(isaD)})`,`${YA} ${esc(prof.ya)} ${MIL}`].map(c=>`<span class="chip">${c}</span>`).join('')}
function applyProf(keys){const k=keys||Object.keys(PMAP);k.forEach(key=>{const val=key==='n'?prof.sc:prof[key];(PMAP[key]||[]).forEach(([tid,fid])=>setField(tid,fid,val))});if(!keys||k.includes('sc'))PMAP.n.forEach(([tid,fid])=>setField(tid,fid,prof.sc));
 const touched=new Set();k.concat(k.includes('sc')?['n']:[]).forEach(key=>(PMAP[key]||[]).forEach(([tid])=>touched.add(tid)));touched.forEach(id=>run(TOOL[id]));chips()}
['sc','z','dt','ks','ky','isa','ya'].forEach(k=>{const c=$('#pf-'+k);const h=()=>{prof[k]=c.value;store.set('prof',JSON.stringify(prof));applyProf([k])};c.addEventListener('input',h);c.addEventListener('change',h)});
if(!store.get('prof')){store.set('prof',JSON.stringify(prof))}chips();
function lcOut(){const o=$('#lc-out'),c=lcCalc(),z=+prof.z;let s='';
 const ks=num(prof.ks),ky=num(prof.ky);if(z>=1&&ks>1e5&&ky>0){const g=utmI(z,'K',ks+3000,ky+3000,INT),a=utmF(...Object.values(ed2wgsM(g.lat,g.lon,'tr')),WGS,z),b=utmF(...Object.values(ed2wgsM(g.lat,g.lon,'eu')),WGS,z);
  s+=`<dl><dt>${L('Paftanda iki yöntem arası fark','Difference between methods on your sheet')}</dt><dd>${fmt(Math.hypot(a.E-b.E,a.N-b.N),1)} m</dd>`}
 else s+='<dl>';
 s+=`<dt>${L('Kullanılan yöntem','Method in use')}</dt><dd>${DM==='tr'?L('Türkiye (EPSG 1784)','Türkiye (EPSG 1784)'):L('Avrupa ortalaması','European mean')}</dd>`;
 if(c){const d=Math.hypot(c.dE,c.dN);s+=`<dt>${L('Yerel kalan fark','Remaining local difference')}</dt><dd>${fmt(c.dE,1)} m ${L('sağa','E')}, ${fmt(c.dN,1)} m ${L('yukarı','N')} (${fmt(d,1)} m)</dd></dl>`;
  s+=d>=200?`<p class="err">${L('Fark çok büyük: noktalar aynı yer değil ya da dilim yanlış. Düzeltme uygulanmadı.','Difference too large: points differ or the zone is wrong. Correction not applied.')}</p>`:LC?`<p class="sub good">${L('Yerel düzeltme açık: bütün ED50 ↔ WGS84 çevirilerine uygulanıyor. Bu noktadan uzaklaştıkça (15–20 km) etkisi azalır.','Local correction is on and applied to every ED50 ↔ WGS84 conversion. It is most accurate within 15–20 km of the point.')}</p>`:`<p class="note">${L('Düzeltmeyi uygulamak için “Kullan”ı seç.','Select “On” to apply the correction.')}</p>`}
 else s+=`</dl><p class="note">${L('Yerel düzeltme için koordinatı iki sistemde de bilinen bir nokta gir: örneğin bir nirengi noktasının paftadaki siyah grid değeri ile o noktada GPS’in verdiği değer.','For a local correction enter a point known in both systems, e.g. a trig point’s black-grid value from the map and the GPS reading at that point.')}</p>`;
 o.innerHTML=s}
function datumChanged(){setDatum();lcOut();T.forEach(run);renderPts()}
[['dm','lc-dm'],['lcEe','lc-ee'],['lcNe','lc-ne'],['lcEw','lc-ew'],['lcNw','lc-nw'],['lcOn','lc-on']].forEach(([k,id])=>{const c=$('#'+id);const h=()=>{prof[k]=c.value;store.set('prof',JSON.stringify(prof));datumChanged()};c.addEventListener('input',h);c.addEventListener('change',h)});
$('#lc-gps').addEventListener('click',()=>{const b=$('#lc-gps');try{navigator.geolocation.getCurrentPosition(pos=>{const z=+prof.z||Math.min(60,Math.floor((pos.coords.longitude+180)/6)+1),u=utmF(pos.coords.latitude,pos.coords.longitude,WGS,z);
 $('#lc-ew').value=Math.round(u.E);$('#lc-nw').value=Math.round(u.N);prof.lcEw=String(Math.round(u.E));prof.lcNw=String(Math.round(u.N));store.set('prof',JSON.stringify(prof));datumChanged();flash(b,L(`Alındı (± ${fmt(pos.coords.accuracy,0)} m)`,`Taken (± ${fmt(pos.coords.accuracy,0)} m)`))},()=>flash(b,L('Konum alınamadı','No position')),{enableHighAccuracy:true,timeout:20000,maximumAge:0})}catch(e){flash(b,L('Konum alınamadı','No position'))}});

/* ---- kayıtlı noktalar ---- */
function ptGeo(p){try{if(p.lat!=null)return{lat:p.lat,lon:p.lon};if(!(p.z>=1&&p.E>1e5&&p.E<9e5))return null;const g=utmI(p.z,'K',p.E,p.N,p.dt==='wgs'?WGS:INT);return p.dt==='wgs'?g:ed2wgs(g.lat,g.lon)}catch(e){return null}}
function renderPts(){$('#pts').innerHTML=pts.length?pts.map((p,i)=>{const g=ptGeo(p);return `<li><input aria-label="${L('Nokta adı','Point name')}" data-pn="${i}" value="${esc(p.name)}"><span></span><div class="c">${esc(p.E)} ${esc(p.N)}${p.z?' · '+L(esc(p.z)+'. dilim','zone '+esc(p.z)):''} · ${p.dt==='wgs'?'WGS84':'ED50'}</div>${g?`<div class="m">${g.lat.toFixed(5)}, ${g.lon.toFixed(5)}${p.z&&p.E>1e5&&p.E<9e5?' · MGRS '+mgrs(p.z,g.lat,p.E,p.N,4):''}</div>`:''}<div class="a"><button class="btn" type="button" data-copy="${esc(p.E+' '+p.N)}">${L('Kopyala','Copy')}</button><button class="btn" type="button" data-use="${i}" data-to="a">${L('A olarak kullan','Use as A')}</button><button class="btn" type="button" data-use="${i}" data-to="b">${L('B olarak kullan','Use as B')}</button><button class="btn" type="button" data-del="${i}">${L('Sil','Delete')}</button></div></li>`}).join(''):`<li class="empty" style="border:0;display:block">${L('Henüz kayıtlı nokta yok.','No saved points yet.')}</li>`;
 $('#ptlist').innerHTML=pts.map(p=>`<option value="${esc(p.E+' '+p.N)}">${esc(p.name)}</option>`).join('')}
function addPt(o){const n=pts.length+1;pts.push({name:o.name||`${L('Nokta','Point')} ${n}`,E:Math.round(o.E),N:Math.round(o.N),z:o.z||null,dt:o.dt||prof.dt,lat:o.lat??null,lon:o.lon??null,t:Date.now()});savePts()}
$('#pts').addEventListener('input',e=>{const i=e.target.dataset.pn;if(i!=null){pts[i].name=e.target.value;store.set('pts',JSON.stringify(pts));$('#ptlist').innerHTML=pts.map(p=>`<option value="${esc(p.E+' '+p.N)}">${esc(p.name)}</option>`).join('')}});
$('#pts').addEventListener('click',e=>{const d=e.target.closest('[data-del]'),u=e.target.closest('[data-use]');
 if(d){pts.splice(+d.dataset.del,1);savePts()}
 if(u){const p=pts[+u.dataset.use];setField('iki',u.dataset.to,`${p.E} ${p.N}`);run(TOOL.iki);go('grid','t-iki')}});
$('#np-add').addEventListener('click',()=>{const p=parsePt($('#np-c').value),er=$('#np-err');if(!p||!p.abs){er.textContent=L('Tam koordinatı “702541 4283911” biçiminde yaz.','Enter full coordinates like “702541 4283911”.');er.hidden=false;return}er.hidden=true;addPt({name:$('#np-name').value.trim(),E:p.E,N:p.N,z:+prof.z||null,dt:prof.dt});$('#np-name').value='';$('#np-c').value=''});
renderPts();lcOut();

/* ---- GPS ---- */
let lastFix=null;
$('#gps-go').addEventListener('click',()=>{const o=$('#gps-out');
 if(!('geolocation' in navigator)){o.innerHTML=`<p class="err">${L('Bu cihaz konum bilgisi vermiyor.','This device does not provide location.')}</p>`;return}
 o.innerHTML=`<p class="note">${L('Konum alınıyor…','Getting position…')}</p>`;
 try{navigator.geolocation.getCurrentPosition(pos=>{const{latitude:la,longitude:lo,accuracy:acc,altitude:alt}=pos.coords;lastFix={la,lo};
  const z=Math.min(60,Math.floor((lo+180)/6)+1),uw=utmF(la,lo,WGS,z),D=wgs2ed(la,lo),ue=utmF(D.lat,D.lon,INT,z),ed=prof.dt!=='wgs',m=ed?ue:uw,r=Math.round;
  const ref=short(m.E,m.N,5);
  o.innerHTML=`<div class="cap">${L('Grid tam koordinatı','Full grid coordinates')} (${ed?'ED50':'WGS84'}, ${L(z+'. dilim','zone '+z)})</div><div class="big">${r(m.E)} ${r(m.N)}</div><p class="sub">± ${fmt(acc,0)} m</p>
  <dl><dt>${L('Kısa koordinat (1 m)','Grid reference (1 m)')}</dt><dd>${ref}</dd><dt>MGRS (WGS84)</dt><dd>${mgrs(z,la,uw.E,uw.N,5)}</dd><dt>${L('Coğrafi (WGS84)','Geographic (WGS84)')}</dt><dd>${fDMS(la,1,HLA)}<br>${fDMS(lo,1,HLO)}</dd><dt>${L('Ondalık','Decimal')}</dt><dd>${la.toFixed(6)}, ${lo.toFixed(6)}</dd><dt>${L('Siyah grid (ED50)','Black grid (ED50)')}</dt><dd>${r(ue.E)} ${r(ue.N)}</dd><dt>${L('Kırmızı grid (WGS84)','Red grid (WGS84)')}</dt><dd>${r(uw.E)} ${r(uw.N)}</dd>${alt!=null?`<dt>${L('GPS yüksekliği','GPS altitude')}</dt><dd>${fmt(alt,0)} m</dd>`:''}</dl>
  ${+prof.z&&+prof.z!==z?`<p class="note">${L(`Bulunduğun yer ${z}. dilimde; Haritam’da ${esc(prof.z)}. dilim kayıtlı.`,`You are in zone ${z}; My map is set to zone ${esc(prof.z)}.`)}</p>`:''}
  <div class="acts"><button class="btn" type="button" data-copy="${r(m.E)} ${r(m.N)}">${L('Kopyala','Copy')}</button><button class="btn" type="button" data-save="${esc(JSON.stringify({E:r(m.E),N:r(m.N),z,dt:ed?'ed50':'wgs',lat:la,lon:lo,name:L('Konumum','My position')+' '+new Date().toLocaleTimeString(LOC,{hour:'2-digit',minute:'2-digit'})}))}">${L('Noktayı kaydet','Save point')}</button><button class="btn" type="button" id="gps-utm">${L('Dönüşüm aracında aç','Open in converter')}</button></div>`;
 },err=>{o.innerHTML=`<p class="err">${err&&err.code===1?L('Konum izni verilmedi. Telefon ayarlarından bu uygulamaya konum izni ver.','Location permission was denied. Allow location for this app in your phone settings.'):L('Konum alınamadı. Açık alanda tekrar dene; bu önizlemede konum kapalı olabilir, telefondaki uygulamada çalışır.','Could not get a position. Try again outdoors; location may be blocked in this preview but works in the phone app.')}</p>`},{enableHighAccuracy:true,timeout:20000,maximumAge:0})}catch(e){o.innerHTML=`<p class="err">${L('Konum bu önizlemede kullanılamıyor; telefondaki uygulamada çalışır.','Location is not available in this preview; it works in the phone app.')}</p>`}});
$('#gps-out').addEventListener('click',e=>{if(e.target.id==='gps-utm'&&lastFix){setField('utm','mode','geo');setField('utm','dt','wgs');setField('utm','la',lastFix.la.toFixed(6));setField('utm','lo',lastFix.lo.toFixed(6));run(TOOL.utm);go('grid','t-utm')}});

/* ---- pusula ---- */
let hd=null,held=null,cmpOn=false,sx=0,sy=0;
function dial(h){let t='';for(let a=0;a<360;a+=10)t+=`<line class="tick" x1="100" y1="${a%90?14:10}" x2="100" y2="22" transform="rotate(${a} 100 100)"/>`;
 const lab=L(['K','D','G','B'],['N','E','S','W']);
 return `<svg class="dial" viewBox="0 0 200 200" role="img" aria-label="${L('Pusula kadranı','Compass dial')}"><circle class="ring" cx="100" cy="100" r="92"/><g transform="rotate(${-h} 100 100)">${t}${lab.map((s,i)=>`<text class="${i?'':'n'}" x="100" y="40" transform="rotate(${i*90} 100 100)">${s}</text>`).join('')}</g><line class="lub" x1="100" y1="4" x2="100" y2="30"/><path class="needle" d="M100 60 l8 40 -8 -8 -8 8z" transform="rotate(${-h} 100 100)"/></svg>`}
function showCmp(){const o=$('#cmp-out'),h=held??hd;if(h==null)return;const mia=toMil(h),isa=num(prof.isa)||0,gia=n64(mia+isa);
 o.innerHTML=`<div class="cap">${MIA}${held!=null?' · '+L('sabitlendi','held'):''}</div><div class="big">${fmt(n64(mia),0)} <small>${MIL}</small></div><p class="sub">${fmt(h,1)}° · ${GIA} ${fmt(gia,0)} ${MIL} (${ISA} ${fmt(isa,0)})</p>${dial(h)}`}
function onOri(e){let h=null;if(typeof e.webkitCompassHeading==='number')h=e.webkitCompassHeading;else if(e.absolute||e.type==='deviceorientationabsolute'){if(e.alpha!=null)h=360-e.alpha}
 if(h==null)return;const so=(screen.orientation&&screen.orientation.angle)||window.orientation||0;h=n360(h+so);
 sx=sx*.8+Math.cos(rad(h))*.2;sy=sy*.8+Math.sin(rad(h))*.2;hd=n360(deg(Math.atan2(sy,sx)));if(held==null)showCmp()}
$('#cmp-go').addEventListener('click',async()=>{const o=$('#cmp-out');let denied=false;
 try{if(typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission==='function'){const r=await DeviceOrientationEvent.requestPermission();denied=r!=='granted'}}catch(e){}
 if(!cmpOn){cmpOn=true;if('ondeviceorientationabsolute' in window)window.addEventListener('deviceorientationabsolute',onOri);else window.addEventListener('deviceorientation',onOri)}
 o.innerHTML=`<p class="note">${L('Pusula verisi bekleniyor…','Waiting for compass data…')}</p>`;$('#cmp-hold').disabled=false;
 setTimeout(()=>{if(hd==null){o.innerHTML=`<p class="err">${denied?L('Pusula izni verilmedi. Telefon ayarlarından hareket ve yön erişimine izin ver.','Compass permission was denied. Allow motion and orientation access in settings.'):L('Bu cihaz ya da önizleme pusula verisi vermiyor. Telefondaki uygulamada dene.','This device or preview gives no compass data. Try the phone app.')}</p>`;$('#cmp-hold').disabled=true}},3000)});
$('#cmp-hold').addEventListener('click',()=>{if(held==null){if(hd==null)return;held=hd;$('#cmp-hold').textContent=L('Serbest bırak','Release');$('#cmp-send').disabled=false}else{held=null;$('#cmp-hold').textContent=L('Değeri sabitle','Hold value');$('#cmp-send').disabled=true}showCmp()});
$('#cmp-send').addEventListener('click',()=>{if(held==null)return;setField('gm','x',Math.round(n64(toMil(held))));setField('gm','tip','mia');setField('gm','u','mil');setField('gm','isa',prof.isa);run(TOOL.gm);go('aci','t-gm')});

/* ---- dört işlem ---- */
function calc(str){const s=str.replace(/[×xX]/g,'*').replace(/[÷:]/g,'/').replace(/−/g,'-');let i=0;const peek=()=>{while(s[i]===' ')i++;return s[i]};
 const pct=r=>{if(peek()==='%'){i++;return r/100}return r};
 function atom(){const c=peek();if(c==='-'){i++;return-atom()}if(c==='+'){i++;return atom()}if(c==='('){i++;const r=expr();if(peek()!==')')throw 0;i++;return pct(r)}
  const m=/^[0-9]+(?:[.,][0-9]+)?|^[.,][0-9]+/.exec(s.slice(i));if(!m)throw 0;i+=m[0].length;return pct(Number(m[0].replace(',','.')))}
 function term(){let r=atom();for(;;){const c=peek();if(c==='*'){i++;r*=atom()}else if(c==='/'){i++;const d=atom();if(d===0)throw 'z';r/=d}else return r}}
 function expr(){let r=term();for(;;){const c=peek();if(c==='+'){i++;r+=term()}else if(c==='-'){i++;r-=term()}else return r}}
 const r=expr();if(peek()!==undefined)throw 0;return r}
const KEYS=['C','(',')','÷','7','8','9','×','4','5','6','−','1','2','3','+','0',DEC,'⌫','='];
$('#keys').innerHTML=KEYS.map(k=>`<button type="button" class="${'÷×−+()'.includes(k)?'op':k==='='?'eq':''}" data-k="${k}" aria-label="${k==='⌫'?L('Sil','Delete'):k}">${k}</button>`).join('');
let hist=[];try{hist=JSON.parse(store.get('hist')||'[]')}catch(e){}
const cin=$('#c-in'),cout=$('#c-out');let last=NaN;{const s=store.get('c-in');if(s!==null)cin.value=s}
function runCalc(){try{last=calc(cin.value);cout.textContent=fmt(last,10)}catch(e){last=NaN;cout.innerHTML=cin.value.trim()?`<span class="err" style="font-size:24px">${e==='z'?L('Sıfıra bölünemez','Cannot divide by zero'):L('İşlem tamamlanmadı','Incomplete expression')}</span>`:'—'}store.set('c-in',cin.value)}
function renderHist(){$('#c-hist').innerHTML=hist.length?hist.map((h,j)=>`<li><button type="button" data-h="${j}"><span>${esc(h.e)}</span><b>= ${esc(fmt(h.r,10))}</b></button></li>`).join(''):`<li class="empty">${L('Henüz kayıt yok.','No history yet.')}</li>`}
function saveHist(){if(!Number.isFinite(last))return;hist.unshift({e:cin.value,r:last});hist=hist.slice(0,12);store.set('hist',JSON.stringify(hist));renderHist()}
$('#keys').addEventListener('click',e=>{const k=e.target.closest('[data-k]')?.dataset.k;if(!k)return;if(k==='C')cin.value='';else if(k==='⌫')cin.value=cin.value.slice(0,-1);else if(k==='='){saveHist();if(Number.isFinite(last))cin.value=String(last).replace('.',DEC)}else cin.value+=('÷×−+'.includes(k)?' '+k+' ':k);runCalc()});
cin.addEventListener('input',runCalc);cin.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();saveHist()}});
$('#c-save').addEventListener('click',saveHist);$('#c-hist').addEventListener('click',e=>{const b=e.target.closest('[data-h]');if(b){cin.value=hist[b.dataset.h].e;runCalc()}});
$('#c-copy').addEventListener('click',e=>copy(e.target,Number.isFinite(last)?fmt(last,10):''));
runCalc();renderHist();

/* ---- genel düğmeler ---- */
function flash(btn,msg){const o=btn.textContent;btn.textContent=msg;setTimeout(()=>btn.textContent=o,1400)}
function fallbackCopy(t){return new Promise((ok,no)=>{try{const a=document.createElement('textarea');a.value=t;a.setAttribute('readonly','');a.style.position='fixed';a.style.opacity='0';document.body.appendChild(a);a.select();const r=document.execCommand('copy');a.remove();r?ok():no()}catch(e){no(e)}})}
function copy(btn,t){if(!t)return;(window.AndroidBridge?new Promise(ok=>{window.AndroidBridge.copy(t);ok()}):navigator.clipboard&&window.isSecureContext?navigator.clipboard.writeText(t).catch(()=>fallbackCopy(t)):fallbackCopy(t)).then(()=>flash(btn,L('Kopyalandı','Copied')),()=>flash(btn,L('Kopyalanamadı','Could not copy')))}
document.addEventListener('click',e=>{const b=e.target.closest('[data-copy]');if(b){copy(b,b.dataset.copy);return}
 const s=e.target.closest('[data-save]');if(s){try{addPt(JSON.parse(s.dataset.save));flash(s,L('Kaydedildi ✓','Saved ✓'))}catch(x){}return}
 const p=e.target.closest('[data-prof]');if(p){try{const o=JSON.parse(p.dataset.prof);Object.keys(o).forEach(k=>{prof[k]=String(o[k]);const c=$('#pf-'+k);if(c)c.value=prof[k]});store.set('prof',JSON.stringify(prof));applyProf(Object.keys(o));flash(p,L('Kaydedildi ✓','Saved ✓'))}catch(x){}return}
 const st=e.target.closest('[data-star]');if(st){const id=st.dataset.star,i=fav.indexOf(id);if(i<0)fav.push(id);else fav.splice(i,1);store.set('fav',JSON.stringify(fav));st.setAttribute('aria-pressed',String(i<0));if(cur==='fav')show('fav');return}});

/* ---- sekmeler, favoriler, arama ---- */
let cur='olcek';
function show(k){if(!TABS.some(t=>t[0]===k))k='olcek';cur=k;
 T.forEach(t=>{const el=$('#t-'+t.id),home=$('#g-'+t.tab);if(k==='fav'&&fav.includes(t.id))$('#g-fav').appendChild(el);else if(el.parentNode!==home)home.appendChild(el)});
 if(k==='fav'){$('#fav-empty').hidden=fav.length>0;T.forEach(t=>{if(!fav.includes(t.id))return;$('#g-fav').appendChild($('#t-'+t.id))})}
 else T.filter(t=>t.tab===k).forEach(t=>$('#g-'+k).appendChild($('#t-'+t.id)));
 $$('.tab').forEach(b=>b.setAttribute('aria-selected',b.dataset.t===k));$$('.panel').forEach(p=>p.hidden=p.id!=='p-'+k);store.set('tab',k);try{if(location.hash!=='#'+k)history.replaceState(null,'','#'+k)}catch(e){}}
function go(tab,elId){show(tab);const el=document.getElementById(elId);if(el){el.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'});el.classList.remove('flash');void el.offsetWidth;el.classList.add('flash')}}
$('#tabs').addEventListener('click',e=>{const b=e.target.closest('.tab');if(b)show(b.dataset.t)});
window.addEventListener('hashchange',()=>show(location.hash.slice(1)));
const fold=s=>String(s).toLocaleLowerCase(LOC).replace(/ı/g,'i').normalize('NFD').replace(/[̀-ͯ]/g,'');
const TABNAME=Object.fromEntries(TABS.map(t=>[t[0],t[1]]));
const IDX=[...T.map(t=>({tab:t.tab,id:'t-'+t.id,title:t.title,text:fold(t.title+' '+t.hint)})),
 ...[['t-prof',L('Haritam (ölçek, dilim, İSA)','My map (scale, zone, G-M)')],['t-lc',L('ED50 ↔ WGS84 hassas dönüşüm (datum, yerel düzeltme)','Precise ED50 ↔ WGS84 (datum, local correction)')],['t-gps',L('Konumum (GPS, koordinat, MGRS)','My position (GPS, coordinates, MGRS)')],['t-cmp',L('Telefon pusulası (MİA, GİA)','Phone compass (MA, GA)')],['t-pts',L('Kayıtlı noktalar','Saved points')]].map(([id,ti])=>({tab:'haritam',id,title:ti,text:fold(ti)})),
 {tab:'hesap',id:'t-calc',title:L('Dört işlem (hesap makinesi)','Calculator'),text:fold(L('dört işlem hesap makinesi toplama çarpma','calculator add multiply'))},{tab:'hakkinda',id:'p-hakkinda',title:L('Hakkında','About'),text:fold(L('hakkında gizlilik sürüm '+OWNER,'about privacy version '+OWNER))}];
const q=$('#q'),qres=$('#qres');
function search(){const s=fold(q.value.trim());if(!s){qres.hidden=true;return}const words=s.split(/\s+/);const hits=IDX.filter(x=>words.every(w=>x.text.includes(w))).slice(0,8);
 qres.innerHTML=hits.length?hits.map(h=>`<li><button type="button" data-go="${h.tab}|${h.id}"><span>${h.title}</span><small>${TABNAME[h.tab]}</small></button></li>`).join(''):`<li class="empty" style="padding:8px 10px">${L('Sonuç yok','No results')}</li>`;qres.hidden=false}
q.addEventListener('input',search);q.addEventListener('focus',search);
q.addEventListener('keydown',e=>{if(e.key==='Escape'){q.value='';qres.hidden=true}if(e.key==='Enter'){const b=qres.querySelector('[data-go]');if(b){e.preventDefault();b.click()}}});
qres.addEventListener('click',e=>{const b=e.target.closest('[data-go]');if(!b)return;const[tab,id]=b.dataset.go.split('|');qres.hidden=true;q.value='';q.blur();go(tab,id)});
document.addEventListener('click',e=>{if(!e.target.closest('.search'))qres.hidden=true});
$$('.lang button').forEach(b=>b.addEventListener('click',()=>{store.set('lang',b.dataset.lang);location.reload()}));
show(location.hash.slice(1)||store.get('tab')||'haritam');
{let p='';for(let i=1;i<9;i++){const r=i*34;let d='';for(let a=0;a<=360;a+=12){const k=rad(a),w=r*(1+.12*Math.sin(3*k+i)+.06*Math.cos(5*k));d+=(a?'L':'M')+(980+w*1.6*Math.cos(k)).toFixed(1)+' '+(90+w*.8*Math.sin(k)).toFixed(1)}p+=`<path d="${d}Z" fill="none" stroke="#fff" stroke-width="1.2"/>`}$('#topo').innerHTML=p}
}
if('serviceWorker' in navigator&&window.isSecureContext&&/^https?:$/.test(location.protocol)){try{navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}}
